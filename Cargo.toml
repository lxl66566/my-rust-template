[package]
authors      = ["lxl66566 <lxl66566@gmail.com>"]
categories   = ["xxx"]
description  = "xxx"
edition      = "2024"
homepage     = "https://github.com/lxl66566/xxx"
include      = ["/CHANGELOG.md", "/LICENSE-*", "/README.md", "/src/**"]
keywords     = ["xxx"]
license      = "MIT OR Apache-2.0"
name         = "xxx"
readme       = "README.md"
repository   = "https://github.com/lxl66566/xxx"
rust-version = "1.85"
version      = "0.1.0"

[dependencies]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.dev]
incremental = true  # Compile your binary in smaller steps.

# If you are building bin target, uncomment this
# [profile.release]
# lto       = true
# opt-level = "s"
# panic     = "abort"
# strip     = true
